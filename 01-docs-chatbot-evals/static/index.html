<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs Chatbot</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1f2328; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #59636e; margin-top: 0; }
  #log { display: flex; flex-direction: column; gap: 12px; margin: 24px 0; }
  .q { align-self: flex-end; background: #0969da; color: #fff; padding: 10px 14px; border-radius: 14px; max-width: 80%; }
  .a { background: #f6f8fa; padding: 12px 14px; border-radius: 14px; white-space: pre-wrap; }
  details { margin-top: 8px; font-size: 13px; color: #59636e; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid #d0d7de; border-radius: 8px; }
  button { padding: 10px 16px; font-size: 15px; border: 0; border-radius: 8px; background: #1f883d; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>Docs Chatbot</h1>
<p class="sub">Answers come only from your documents, with the sources shown.</p>
<div id="log"></div>
<form id="f">
  <input id="q" placeholder="Ask about leave, travel, expenses..." autocomplete="off" required>
  <button>Ask</button>
</form>
<script>
const log = document.getElementById("log");
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("q");
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  const q = document.createElement("div");
  q.className = "q";
  q.textContent = question;
  log.appendChild(q);
  const a = document.createElement("div");
  a.className = "a";
  a.textContent = "Thinking...";
  log.appendChild(a);
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    a.textContent = data.answer;
    const d = document.createElement("details");
    const s = document.createElement("summary");
    s.textContent = "Sources";
    d.appendChild(s);
    data.sources.forEach((src) => {
      const p = document.createElement("p");
      p.textContent = `[${src.n}] ${src.heading || "(no heading)"}`;
      d.appendChild(p);
    });
    a.appendChild(d);
  } catch (err) {
    a.textContent = "Something went wrong: " + err;
  }
});
</script>
</body>
</html>
